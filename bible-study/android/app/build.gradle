// Kam Team Bible Study Guide for Android: a Trusted Web Activity that opens the
// GitHub Pages site full screen in Chrome. See bible-study/android/README.md.
plugins { id "com.android.application" }

// The site the app opens. Change these if the app moves to its own domain.
def siteHost = "sandrhiks.github.io"
def sitePath = "/Kam-team-Lead-generator/"
def startUrl = "https://" + siteHost + sitePath + "#today"

android {
    namespace "com.kamteam.biblestudy"
    compileSdk 35

    defaultConfig {
        applicationId "com.kamteam.biblestudy"
        minSdk 21
        targetSdk 35
        // CI passes the run number so every APK installs over the last one.
        versionCode((project.findProperty("versionCode") ?: "1") as int)
        versionName project.findProperty("versionName") ?: "1.0"

        manifestPlaceholders = [siteHost: siteHost, sitePath: sitePath, startUrl: startUrl]
        resValue "string", "asset_statements",
            "[{\\\"relation\\\": [\\\"delegate_permission/common.handle_all_urls\\\"], \\\"target\\\": {\\\"namespace\\\": \\\"web\\\", \\\"site\\\": \\\"https://" + siteHost + "\\\"}}]"
    }

    // The release key comes from environment variables (GitHub secrets in CI).
    def ks = System.getenv("KBS_KEYSTORE_FILE")
    signingConfigs {
        if (ks) {
            release {
                storeFile file(ks)
                storePassword System.getenv("KBS_KEYSTORE_PASSWORD")
                keyAlias System.getenv("KBS_KEY_ALIAS")
                keyPassword System.getenv("KBS_KEY_PASSWORD") ?: System.getenv("KBS_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (ks) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { resValues true }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
}
