# Builds the Kam Team Bible Study Guide Android app (an APK) and publishes it as a
# GitHub Release, so people can download it from:
#   https://github.com/Sandrhiks/Kam-team-Lead-generator/releases/latest/download/kam-bible-study.apk
# Setup: bible-study/android/README.md.
#
# Secrets it reads (Settings → Secrets and variables → Actions → Secrets):
#   ANDROID_KEYSTORE_BASE64    the signing key file (.jks), base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  its password
#   ANDROID_KEY_ALIAS          the key's alias inside it (kbs)
# Keep the same key forever: Android only installs an update signed with the same key.
name: Bible Study Android app

on:
  push:
    branches: [main]
    paths:
      - "bible-study/android/**"
      - "bible-study/public/manifest.webmanifest"
      - ".github/workflows/bible-study-android.yml"
  pull_request:
    paths:
      - "bible-study/android/**"
      - ".github/workflows/bible-study-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bible-study-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build the APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the release
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KBS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KBS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Load the signing key
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KBS_KEYSTORE_PASSWORD" ] || [ -z "$KBS_KEY_ALIAS" ]; then
            if [ "$PUBLISH" = "true" ]; then
              echo "::error::Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS in Settings → Secrets and variables → Actions. See bible-study/android/README.md."
              exit 1
            fi
            echo "::warning::No signing key set, so this test build is signed with a throwaway debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kbs.jks"
          echo "KBS_KEYSTORE_FILE=$RUNNER_TEMP/kbs.jks" >> "$GITHUB_ENV"

      - name: Build
        working-directory: bible-study/android
        run: |
          task=assembleRelease
          [ -n "$KBS_KEYSTORE_FILE" ] || task=assembleDebug
          gradle "$task" --no-daemon -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}
          apk=$(find app/build/outputs/apk -name '*.apk' | grep -v unsigned | head -1)
          [ -n "$apk" ] || { echo "::error::No signed APK was built"; exit 1; }
          cp "$apk" "$GITHUB_WORKSPACE/kam-bible-study.apk"

      # Chrome checks this file on the site before it hides the address bar.
      - name: Write assetlinks.json
        if: env.KBS_KEYSTORE_FILE != ''
        run: |
          fp=$(keytool -list -v -keystore "$KBS_KEYSTORE_FILE" -storepass "$KBS_KEYSTORE_PASSWORD" -alias "$KBS_KEY_ALIAS" \
               | sed -n 's/^[[:space:]]*SHA256: //p' | head -1)
          [ -n "$fp" ] || { echo "::error::Couldn't read the key's SHA-256 fingerprint"; exit 1; }
          cat > assetlinks.json <<EOF
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "android_app",
              "package_name": "com.kamteam.biblestudy",
              "sha256_cert_fingerprints": ["$fp"]
            }
          }]
          EOF
          {
            echo "### Digital Asset Links"
            echo "Put this at \`https://sandrhiks.github.io/.well-known/assetlinks.json\` (see bible-study/android/README.md):"
            echo '```json'; cat assetlinks.json; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$KBS_KEYSTORE_FILE"

      - uses: actions/upload-artifact@v4
        with:
          name: kam-bible-study-apk
          path: |
            kam-bible-study.apk
            assetlinks.json
          if-no-files-found: warn

      - name: Publish the release
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bible-study-android-v${{ github.run_number }}
          name: Bible Study Android app 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            Download **kam-bible-study.apk** below on your Android phone, open it and tap **Install**.
            If Android asks, allow installs from your browser or Files app.
          files: |
            kam-bible-study.apk
            assetlinks.json
