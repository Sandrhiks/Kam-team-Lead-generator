services:
  - type: web
    name: kam-team-lead-generator
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: GHL_WEBHOOK_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: API_KEY
        sync: false
